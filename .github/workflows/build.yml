name: Cross-Platform Build & Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Package for ${{ matrix.display_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            display_name: windows-latest-x64
            artifact-path: |
              kinonode-ui/build/jpackage/*
              kinonode-ui/build/distributions/*
              build/distributions/*
              build/installers/*
          - os: ubuntu-latest
            arch: x64
            display_name: linux-latest-x64
            artifact-path: |
              kinonode-ui/build/jpackage/*
              kinonode-ui/build/distributions/*
              build/distributions/*
              build/installers/*
          - os: macos-latest
            arch: x64
            display_name: macos-latest-x64
            artifact-path: |
              kinonode-ui/build/jpackage/*
              kinonode-ui/build/distributions/*
              build/distributions/*
              build/installers/*

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          architecture: ${{ matrix.arch }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: matrix.os != 'windows-latest'
        run: chmod +x gradlew

      - name: Install and Add WiX Toolset to PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command light.exe -ErrorAction SilentlyContinue)) {
            Write-Host "Installing WiX Toolset v3 via Chocolatey..."
            choco install wixtoolset -y --no-progress
          }
          $wixBinPath = Get-ChildItem -Path "C:\Program Files (x86)", "C:\Program Files" -Filter "WiX Toolset v3*" -Directory -ErrorAction SilentlyContinue |
                        ForEach-Object { Join-Path $_.FullName "bin" } |
                        Where-Object { Test-Path (Join-Path $_ "light.exe") } |
                        Select-Object -First 1
          if ($wixBinPath) {
            Write-Host "Adding WiX Toolset bin path to GITHUB_PATH: $wixBinPath"
            $wixBinPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$wixBinPath;$env:PATH"
          } else {
            Write-Error "Failed to locate WiX Toolset v3 bin directory."
            exit 1
          }

      - name: Build and Test
        run: ./gradlew test

      # Platform-specific native installer and portable packaging
      - name: Package Windows (.exe, .msi, portable .zip, and .tar.gz)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p kinonode-ui/build/jpackage-saved
          ./gradlew jpackage -PinstallerType=exe -PtargetArch=${{ matrix.arch }}
          cp kinonode-ui/build/jpackage/*.* kinonode-ui/build/jpackage-saved/ || true
          ./gradlew jpackage -PinstallerType=msi -PtargetArch=${{ matrix.arch }}
          cp kinonode-ui/build/jpackage/*.* kinonode-ui/build/jpackage-saved/ || true
          ./gradlew windowsX64AppImageZip
          ./gradlew windowsX64AppImageTar
        shell: bash

      - name: Package Linux (.deb, .rpm, portable .zip, and .tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils fakeroot dpkg-dev rpm
          mkdir -p kinonode-ui/build/jpackage-saved
          ./gradlew jpackage -PinstallerType=deb -PtargetArch=${{ matrix.arch }}
          cp kinonode-ui/build/jpackage/*.* kinonode-ui/build/jpackage-saved/ || true
          ./gradlew jpackage -PinstallerType=rpm -PtargetArch=${{ matrix.arch }}
          cp kinonode-ui/build/jpackage/*.* kinonode-ui/build/jpackage-saved/ || true
          ./gradlew linuxAppImageZip
          ./gradlew linuxAppImageTar

      - name: Package macOS (.dmg, .pkg, portable .zip, and .tar.gz)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p kinonode-ui/build/jpackage-saved
          ./gradlew jpackage -PinstallerType=dmg -PtargetArch=${{ matrix.arch }}
          cp kinonode-ui/build/jpackage/*.* kinonode-ui/build/jpackage-saved/ || true
          ./gradlew jpackage -PinstallerType=pkg -PtargetArch=${{ matrix.arch }}
          cp kinonode-ui/build/jpackage/*.* kinonode-ui/build/jpackage-saved/ || true
          ./gradlew macAppImageZip
          ./gradlew macAppImageTar

      - name: Rename artifacts
        shell: bash
        run: |
          mkdir -p build/installers
          # Rename jpackage outputs
          if [ -d "kinonode-ui/build/jpackage-saved" ]; then
            for file in kinonode-ui/build/jpackage-saved/*; do
              if [ -f "$file" ]; then
                ext="${file##*.}"
                # Get architecture mapping
                arch_suffix="${{ matrix.arch }}"
                # Check for rpm and deb special naming
                if [[ "$ext" == "rpm" || "$ext" == "deb" ]]; then
                  arch_suffix="amd64"
                fi
                # Formulate the new name
                os_suffix=""
                if [[ "${{ matrix.os }}" == "windows-latest" ]]; then os_suffix="windows"; fi
                if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then os_suffix="linux"; fi
                if [[ "${{ matrix.os }}" == "macos-latest" ]]; then os_suffix="macos"; fi
                
                new_name="KinoNode-1.0.1-${os_suffix}-${arch_suffix}.${ext}"
                mv "$file" "build/installers/$new_name"
              fi
            done
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KinoNode-${{ matrix.display_name }}-artifacts
          path: |
            build/distributions/*
            build/installers/*
          if-no-files-found: warn

  release:
    name: Publish Release Artifacts
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
