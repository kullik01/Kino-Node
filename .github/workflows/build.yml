name: Cross-Platform Build & Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:


jobs:
  build-and-package:
    name: Package for ${{ matrix.display_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            display_name: windows-latest
            artifact-path: |
              build/installers/*.exe
              build/installers/*.msi
              build/distributions/*.zip
          - os: ubuntu-latest
            display_name: linux-latest
            artifact-path: |
              build/installers/*.deb
              build/installers/*.rpm
              build/distributions/*.zip
              build/distributions/*.tar.gz
          - os: macos-latest
            display_name: macos-latest
            artifact-path: |
              build/installers/*.dmg
              build/installers/*.pkg
              build/distributions/*.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: matrix.os != 'windows-latest'
        run: chmod +x gradlew

      - name: Install and Add WiX Toolset to PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command light.exe -ErrorAction SilentlyContinue)) {
            Write-Host "Installing WiX Toolset v3 via Chocolatey..."
            choco install wixtoolset -y --no-progress
          }
          $wixBinPath = Get-ChildItem -Path "C:\Program Files (x86)", "C:\Program Files" -Filter "WiX Toolset v3*" -Directory -ErrorAction SilentlyContinue |
                        ForEach-Object { Join-Path $_.FullName "bin" } |
                        Where-Object { Test-Path (Join-Path $_ "light.exe") } |
                        Select-Object -First 1
          if ($wixBinPath) {
            Write-Host "Adding WiX Toolset bin path to GITHUB_PATH: $wixBinPath"
            $wixBinPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$wixBinPath;$env:PATH"
          } else {
            Write-Error "Failed to locate WiX Toolset v3 bin directory."
            exit 1
          }

      - name: Build and Test
        run: ./gradlew test

      # Platform-specific native installer and portable packaging
      - name: Package Windows (.exe, .msi, and portable .zip)
        if: matrix.os == 'windows-latest'
        run: |
          ./gradlew jpackage -PinstallerType=exe
          ./gradlew jpackage -PinstallerType=msi
          ./gradlew windowsAppImageZip

      - name: Package Linux (.deb, .rpm, portable .zip, and .tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils fakeroot dpkg-dev rpm
          ./gradlew jpackage -PinstallerType=deb
          ./gradlew jpackage -PinstallerType=rpm
          ./gradlew linuxAppImageZip
          ./gradlew linuxAppImageTar

      - name: Package macOS (.dmg, .pkg, and portable .zip)
        if: matrix.os == 'macos-latest'
        run: |
          ./gradlew jpackage -PinstallerType=dmg
          ./gradlew jpackage -PinstallerType=pkg
          ./gradlew macAppImageZip


