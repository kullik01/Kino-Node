name: Package KinoNode

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Package for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact-path: |
              build/jpackage/*.exe
              build/distributions/*.zip
          - os: ubuntu-latest
            artifact-path: |
              build/jpackage/*.deb
              build/jpackage/*.rpm
              build/distributions/*.zip
          - os: macos-latest
            artifact-path: |
              build/jpackage/*.dmg
              build/jpackage/*.pkg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: matrix.os != 'windows-latest'
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew test

      # Platform-specific packaging
      - name: Package Windows (.exe and .zip)
        if: matrix.os == 'windows-latest'
        run: |
          ./gradlew jpackage
          ./gradlew windowsAppImageZip

      - name: Package Linux (.deb, .rpm, and .zip)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Install dependencies for rpm building
          sudo apt-get update
          sudo apt-get install -y rpm
          # Build packages
          ./gradlew jpackage -PinstallerType=deb
          ./gradlew jpackage -PinstallerType=rpm
          ./gradlew linuxAppImageZip

      - name: Package macOS (.dmg and .pkg)
        if: matrix.os == 'macos-latest'
        run: |
          ./gradlew jpackage -PinstallerType=dmg
          ./gradlew jpackage -PinstallerType=pkg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kinonode-release-${{ matrix.os }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
